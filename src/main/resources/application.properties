spring.application.name=hospital-eip-interactive
camel.springboot.main-run-controller=true
spring.main.banner-mode=off

# No RabbitMQ and no external broker is required.
# Apache ActiveMQ 6 runs as an embedded in-memory JMS broker for this lab.
camel.component.activemq6.embedded=true
camel.component.activemq6.jms-message-type=Text
